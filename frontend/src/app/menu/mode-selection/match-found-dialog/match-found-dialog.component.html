<div class="modal-header xp-header" style="justify-content: center;">
  <h4>Match Found!</h4>
</div>
<div class="modal-body xp-body">
  <p>Ein Gegner wurde gefunden!</p>
  <p>Möchtest du das Spiel starten?</p>
</div>
<div class="modal-footer" style="justify-content: center; gap: 10px;">
  <button type="button" class="xp-btn" (click)="onDeclineClick()">Ablehnen</button>
  <button type="button" class="xp-btn" (click)="onJoinClick()">Spiel starten</button>
</div>
