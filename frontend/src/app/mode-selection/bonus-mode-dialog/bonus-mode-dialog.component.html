<div class="modal-header xp-header">
  <div class="position-relative" style="width: 100%;">
    <h4 class="modal-title">Bonuseffekte aktivieren?</h4>
    <div class="position-absolute top-50 end-0 translate-middle-y">
      <button type="button" class="xp-btn-close" aria-label="Close" (click)="closeDialog()"></button>
    </div>
  </div>
</div>

<div class="modal-body xp-body">
  <p class="message">
    Möchtest du diese Runde mit Bonuseffekten spielen?
  </p>
  <p class="details">
    Du entscheidest selbst, ob und wann du einen zugewiesenen Effekt auslöst. In Spieler vs. Bot verwendet nur der Bot seine Effekte automatisch.
  </p>
</div>

<div class="modal-footer xp-footer justify-content-center dialog-actions">
  <button class="btn xp-btn" (click)="chooseBonusMode(false)">Ohne Bonuseffekte</button>
  <button class="btn xp-btn" (click)="chooseBonusMode(true)">Mit Bonuseffekten</button>
</div>
