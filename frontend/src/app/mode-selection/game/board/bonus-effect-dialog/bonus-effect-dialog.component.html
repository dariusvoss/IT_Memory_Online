<div class="modal-header xp-header">
  <div class="position-relative" style="width: 100%;">
    <h4 class="modal-title">{{ title }}</h4>
    <div class="position-absolute top-50 end-0 translate-middle-y">
      <button type="button" class="xp-btn-close" aria-label="Close" (click)="closeDialog()"></button>
    </div>
  </div>
</div>

<div class="modal-body xp-body">
  @if (effectLabel) {
    <p class="effect-name">{{ effectLabel }}</p>
  }
  <p class="message">{{ message }}</p>
  @if (showTriggerHint) {
    <p class="hint">Der Button im Spiel wird jetzt aktiv, sobald du wieder am Zug bist.</p>
  }
</div>

<div class="modal-footer xp-footer justify-content-center">
  <button class="btn xp-btn" (click)="closeDialog()">OK</button>
</div>
