<div class="modal-header">
  <div class="container ">
    <div class="item">
      <h4 class="modal-title">Memory-Spiel</h4>
    </div>
    <div class="item">
      <b>Am Zug ist:</b><br>
      {{this.gameService.difficultyGetter ==='none' ? 'Player' : (isPlayerTurn ? 'Player' : 'Bot')}}
    </div>
    <!-- <div class="center"><h5>Highscore: highscore</h5></div>-->
    <div *ngIf=" gameService.difficultyGetter === 'none'  "><h5>Zeit: {{time}}</h5></div> 

  </div>
  <div class="right">
    <button type="button" class="close" (click)="closeModal()">
      &times;
    </button>
  </div>
</div>

<div class="modal-body">
  <app-board></app-board> <!-- Spielfeld anzeigen -->
</div>

<div class="modal-footer">
  <div class="container">
    <div class="item">
      Spieler : {{playerPoints}}
    </div>
    <div *ngIf="this.gameService.difficultyGetter !== 'none' " class="center">
      Bot : {{botPoints}}
    </div>

  </div>
  <div class="right">
    <button class="btn btn-secondary" (click)="closeModal()">Schließen</button>
  </div>
</div>
