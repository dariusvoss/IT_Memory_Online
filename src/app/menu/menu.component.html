<div class="menu-container">
  <div class="d-grid gap-2" style="width: 65%">
    <div class="d-grid gap-0" style="width: 100%" *ngIf="!gameService.gameStarted">
      <p style="text-align: center; margin-bottom: 2px;">Wähle einen Spielmodus:</p>
      <!-- Wenn das Spiel noch nicht gestartet wurde -->
      <div class="btn-group dropend">
        <button type="button" class="btn xp-btn" style="width: 90%;" (click)="chooseSize('PvB')">
          Spieler vs. Bot ({{gameService.difficultyGetter}})
        </button>
        <button type="button"
          class="btn-primary-custom-width btn xp-btn dropdown-toggle dropdown-toggle-split "
          data-bs-toggle="dropdown" aria-expanded="false">
        </button>
        <ul class="dropdown-menu">
          <li><a class="dropdown-item" (click)="selectEasy()">Leicht</a></li>
          <li><a class="dropdown-item" (click)="selectMedium()">Mittel</a></li>
          <li><a class="dropdown-item" (click)="selectHard()">Schwer</a></li>
        </ul>
      </div>
      <!-- <button type="button" class="btn btn-outline-primary" (click)="openPvBDialog()">Spieler vs. Bot</button> -->
      <button type="button" class="btn xp-btn" (click)="chooseSize('PvT')">Spieler vs. Zeit</button>
    </div>
    <div class="d-grid gap-0" style="width: 100%; margin-top: 5px" *ngIf="gameService.gameStarted">
      <button type="button" class="btn xp-btn" (click)="resumeDialog()">Spiel fortsetzen</button>
      <button type="button" class="btn xp-btn" (click)="restartDialog()">Neues Spiel starten</button>
    </div>
    <hr style="margin: 0px; padding: 4px;">
    <button type="button" class="btn xp-btn" (click)="openScoreboard()">Scoreboard</button>
  </div>
</div>
