<div class="modal-header">
  <h4 class="modal-title">Spiel beendet</h4>
  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" (click)="closeDialog()"></button>
</div>
<div class="modal-body">
  <p class="content">{{message}}</p>
  <div class="content">
    <p *ngIf="difficulty === 'None'">Deine Zeit: <strong>{{ time }}</strong></p>
    <div *ngIf="playerPoints !== undefined && botPoints !== undefined">
      <div *ngIf="difficulty !== 'None'">Spieler-Punkte: <strong>{{ playerPoints }}</strong><br>Bot-Punkte: <strong>{{ botPoints }}</strong></div>
    </div>
  </div>
</div>
<div class="modal-footer container justify-content-center">
  <div class="row justify-content-center">
    <button class="btn btn-primary col" (click)="openScoreboard()">Scoreboard</button>
    <button class="btn btn-primary col" (click)="closeDialog()">OK</button>
  </div>
</div>
