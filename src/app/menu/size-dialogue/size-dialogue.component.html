<div class="modal-header xp-header" style="justify-content: center;">
  <h4>Kartensatzgröße</h4>
</div>

<div class="modal-body">
  <p>Wähle eine Kartensatzgröße...</p>
  <div class="d-grid gap-2">
    <button class="btn xp-btn" (click)="selectSize(16)">Klein (16 Karten)</button>
    <button class="btn xp-btn" (click)="selectSize(36)">Mittel (36 Karten)</button>
    <button class="btn xp-btn" (click)="selectSize(64)">Groß (64 Karten)</button>
  </div>   
</div>
