<div class="scoreboard">
  <h2>Scoreboard</h2>
  <table>
    <thead>
      <tr>
        <th>Datum</th>
        <th>Modus</th>
        <th>Schwierigkeitsgrad</th>
        <th>Kartensatzgröße</th>
        <th>Punkte</th>
        <th>Rang</th>
        <th>Zeit</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let record of gameRecords">
        <td>{{ record.date }}</td>
        <td>{{ record.mode }}</td>
        <td>{{ record.difficultyLevel }}</td>
        <td>{{ record.deckSize }}</td>
        <td>{{ record.points }}</td>
        <td>{{ record.rank }}</td>
        <td>{{ record.time }}</td>
      </tr>
    </tbody>
  </table>
</div>
