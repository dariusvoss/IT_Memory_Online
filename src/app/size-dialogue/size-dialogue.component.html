<div class="modal-header">
    <h4>Kartensatzgröße</h4>
</div>

<div class="modal-body">
    <h6>Wähle eine Kartensatzgröße...</h6>
    <div class="d-grid gap-2">
        <button class="btn btn-primary" (click)="selectSize(16)">🃏 Klein (16 Karten)</button>
        <button class="btn btn-primary" (click)="selectSize(36)">🃏 Mittel (36 Karten)</button>
        <button class="btn btn-primary" (click)="selectSize(64)">🃏 Groß (64 Karten)</button>
    </div>   
</div>
