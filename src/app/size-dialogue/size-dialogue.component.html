<div class="modal-header">
    <h4>Kartensatzgröße</h4>
</div>

<div class="modal-body">
    <div class="input-group mb-3">
        <!-- <label class="input-group-text" for="inputGroupSelect01">Options</label> -->
        <select class="form-select" id="inputGroupSelect01">
          <option selected>Wähle eine Kartensatzgröße...</option>
          <option value="1">Klein (16 Karten)</option>
          <option value="2">Mittel (36 Karten)</option>
          <option value="3">Groß (64 Karten)</option>
        </select>
    </div>   
</div>

<div class="modal-footer">
    <button class="btn btn-secondary" (click)="closeModal()">Schließen</button>
</div>
